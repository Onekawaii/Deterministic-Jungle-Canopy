name: Sovereign Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "canopy/**"
      - "static/**"
      - "scripts/**"
      - "tests/**"
      - "server.py"
      - "cli.py"
      - "README.md"
      - "docs/**"
      - "requirements*.txt"
      - "RUN_CANOPY_WINDOWS.*"
      - "VERIFY_SOVEREIGN_RELEASE.ps1"
      - ".github/workflows/sovereign-release-gate.yml"

jobs:
  windows-release-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fresh-clone launcher install and smoke
        shell: pwsh
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          .\RUN_CANOPY_WINDOWS.ps1 -NoBrowser -SmokeTest -Port 18081

      - name: Visible optional-acceleration fallback
        shell: pwsh
        run: |
          $env:CANOPY_ACCELERATION = "cuda"
          $output = & .\RUN_CANOPY_WINDOWS.ps1 -NoInstall -NoBrowser -SmokeTest -Port 18082 *>&1
          $text = ($output | Out-String)
          Write-Host $text
          if ($text -notmatch "ACCELERATION_FALLBACK=CPU") { throw "CPU fallback was not visible" }
          Remove-Item Env:CANOPY_ACCELERATION

      - name: Add release verification dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements-release.txt
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Full Sovereign release gate
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\sovereign_release_gate.py

      - name: Upload release receipts and archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-canopy-release-gate
          path: |
            receipts/release_gate/**
            dist/**
          if-no-files-found: warn
